name: catraca
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CATRACA_DB: /data/catraca.sqlite
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 1s
      timeout: 2s
      retries: 30
volumes:
  data:
